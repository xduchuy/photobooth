<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summer - Photobooth</title>
  <meta name="description" content="Summer board layout for photobooth brand kit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="summer-page">
  <div class="noise" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar">
      <div class="topbar-left">
        <a class="logo-link" href="index.html" aria-label="Home" data-i18n-aria="brand.home">
          <img class="logo-img" src="fire.png" alt="Photobooth logo" data-i18n-alt="brand.logoAlt">
        </a>
      </div>
      <nav class="nav">
        <a href="gioithieu.html" data-i18n="nav.about">about</a>
        <a href="layout.html" data-i18n="nav.choose">studio</a>
        <a href="chinhsach.html" data-i18n="nav.privacy">privacy policy</a>
        <a href="index.html#contact" data-i18n="nav.contact">contact</a>
      </nav>
      <div class="topbar-right">
        <button class="lang-toggle" type="button" aria-label="Switch language">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M3.5 12h17M12 3.5c2.5 2.8 4 6 4 8.5s-1.5 5.7-4 8.5M12 3.5c-2.5 2.8-4 6-4 8.5s1.5 5.7 4 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
          <span class="lang-label">VI</span>
        </button>
      </div>
    </header>

    <section class="summer-board">
      <div class="summer-grid">
        <h1 class="summer-title" aria-label="Holiday">
          <span class="summer-letter summer-letter--teal summer-letter--dot">H</span>
          <span class="summer-letter summer-letter--teal">O</span>
          <span class="summer-letter summer-letter--teal">L</span>
          <span class="summer-letter summer-letter--teal">I</span>
          <span class="summer-letter summer-letter--gold">D</span>
          <span class="summer-letter summer-letter--gold">A</span>
          <span class="summer-letter summer-letter--gold">Y</span>
        </h1>

        <article class="summer-card summer-card--hero">
          <p class="summer-hero-caption">
            Enjoy the holiday atmosphere at the beginning of 2026
            in a relaxed and comfortable way.
          </p>
        </article>

        <div class="summer-card summer-card--icon" aria-hidden="true">
          <span class="summer-icon">H</span>
        </div>

        <div class="summer-card summer-card--photo summer-card--photo-a" aria-hidden="true"></div>

        <div class="summer-card summer-card--photo summer-card--tee">
          <div class="summer-tee">
            <span>HOLIDAY</span>
          </div>
        </div>

        <div class="summer-card summer-card--note">
          <span>Made for breaks you'll remember</span>
        </div>

        <div class="summer-card summer-card--font">
          <div class="summer-font">
            <span class="summer-font-label">Font</span>
            <span class="summer-font-name">Museo</span>
            <span class="summer-font-sample">Aa</span>
          </div>
        </div>

        <div class="summer-card summer-card--banner">
          <span class="summer-banner-word">HOLIDAY</span>
        </div>
      </div>
    </section>
  </main>

  <script src="lang.js"></script>
</body>
</html>
