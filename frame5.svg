<svg width="540" height="960" viewBox="0 0 540 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="film-mask">
      <rect width="540" height="960" fill="white"/>
      <!-- The 3 slots to be transparent (black in mask) -->
      <rect x="40" y="40" width="460" height="280" rx="4" fill="black"/>
      <rect x="40" y="340" width="460" height="280" rx="4" fill="black"/>
      <rect x="40" y="640" width="460" height="280" rx="4" fill="black"/>
    </mask>
  </defs>

  <!-- Background with slight noise or paper texture feel, masked -->
  <rect width="540" height="960" fill="#FFFBF0" mask="url(#film-mask)"/>
  
  <!-- Borders / Outlines for the slots (drawn on top) -->
  <rect x="40" y="40" width="460" height="280" rx="4" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 5"/>
  <rect x="40" y="340" width="460" height="280" rx="4" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 5"/>
  <rect x="40" y="640" width="460" height="280" rx="4" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 5"/>
  
  <!-- Decorations -->
  <circle cx="500" cy="900" r="15" fill="#FF6B6B" fill-opacity="0.8"/>
  <circle cx="470" cy="920" r="10" fill="#FFD93D" fill-opacity="0.8"/>
  <path d="M40 900 Q 100 940 160 900 T 280 900" stroke="#6C5CE7" stroke-width="3" fill="none"/>
  
  <text x="40" y="930" font-family="monospace" font-size="24" fill="#333">Just Vibe</text>
</svg>
