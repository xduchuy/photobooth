<svg width="580" height="560" viewBox="0 0 580 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="vintage-mask">
      <rect width="580" height="560" fill="white"/>
      <!-- Photo Slot -->
      <rect x="50" y="50" width="480" height="380" fill="black"/>
    </mask>
  </defs>
  
  <!-- Vintage Paper Background -->
  <rect width="580" height="560" fill="#fdf6e3" mask="url(#vintage-mask)"/>
  
  <!-- Texture simulation (lines) -->
  <path d="M0 0 L580 0" stroke="#dcb" stroke-width="2"/>
  <path d="M0 560 L580 560" stroke="#dcb" stroke-width="2"/>
  
  <!-- Photo Slot Border -->
  <rect x="40" y="40" width="500" height="400" fill="none" stroke="#c0b090" stroke-width="1"/>
  
  <!-- Tape effect on corners -->
  <rect x="250" y="20" width="80" height="30" fill="#eaddcf" transform="rotate(-2 290 35)"/>
  
  <!-- Text -->
  <text x="50%" y="520" text-anchor="middle" font-family="serif" font-style="italic" font-size="36" fill="#5c4b37">Memories</text>
  <text x="50%" y="490" text-anchor="middle" font-family="serif" font-size="14" fill="#8c7b67" letter-spacing="4">EST. 2026</text>
</svg>
